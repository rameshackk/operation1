<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield / Tile -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#fef3c7" stroke-width="8" stroke-opacity="0.25"/>
  
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#fef3c7" stroke-width="16" stroke-opacity="0.4"/>
  
  <!-- Compass Cardinal Ticks -->
  <path d="M256 60v32M256 420v32M60 256h32M420 256h32" stroke="#fef3c7" stroke-width="16" stroke-linecap="round" stroke-opacity="0.6"/>
  
  <!-- Rising Investment Arrow -->
  <path d="M340 172L172 340" stroke="#fef3c7" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M220 172h120v120" stroke="url(#arrowGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center Core Pivot -->
  <circle cx="256" cy="256" r="30" fill="#ffffff"/>
  <circle cx="256" cy="256" r="14" fill="#d97706"/>
</svg>
