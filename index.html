  <!-- Animated Mutual Fund & Wealth Growth Background Engine -->
  <canvas id="growth-canvas" class="fixed inset-0 pointer-events-none z-0 select-none"></canvas>
  <script>
    (function() {
      const canvas = document.getElementById('growth-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let w = 0, h = 0;
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.scale(dpr, dpr);
      }
      resize();
      window.addEventListener('resize', resize, { passive: true });

      // Financial Wealth Badges & Symbols
      const symbols = ['₹', '+18.4%', '+24.6%', 'SIP ↑', 'NAV ↑', '₹10L', '₹1Cr', '📈', '💹', '⭐', '+15.2%', '₹'];
      const colors = ['#f59e0b', '#10b981', '#fbbf24', '#34d399', '#38bdf8', '#ffffff'];

      // Rising Wealth Floating Elements
      const items = [];
      const count = 38;

      for (let i = 0; i < count; i++) {
        const isLeft = Math.random() < 0.52;
        const x = isLeft ? Math.random() * (w * 0.22) + 10 : w * 0.78 + Math.random() * (w * 0.20);
        items.push({
          x: x,
          y: Math.random() * h,
          vy: Math.random() * 0.75 + 0.35,
          vx: (Math.random() - 0.5) * 0.25,
          text: symbols[Math.floor(Math.random() * symbols.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 5 + 11,
          alpha: Math.random() * 0.45 + 0.45,
          isBadge: Math.random() > 0.45
        });
      }

      let time = 0;

      function render() {
        ctx.clearRect(0, 0, w, h);
        time += 0.015;

        // 1. Draw Glowing Ascending Financial Growth Curves (Bull Market Trendline)
        ctx.save();
        
        // Golden Trend Wave
        ctx.beginPath();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.45)';
        for (let x = 0; x <= w; x += 15) {
          const progress = x / w;
          const baseline = h * 0.82 - progress * (h * 0.62);
          const y = baseline + Math.sin(x * 0.005 + time) * 35 + Math.cos(x * 0.008 - time * 0.7) * 20;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Emerald Compounding Wave
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
        for (let x = 0; x <= w; x += 15) {
          const progress = x / w;
          const baseline = h * 0.88 - progress * (h * 0.68);
          const y = baseline + Math.sin(x * 0.006 - time * 1.1) * 30 + Math.cos(x * 0.004 + time * 0.5) * 25;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Glowing Milestone Nodes on the Golden Trendline
        for (let i = 1; i <= 5; i++) {
          const nx = (w / 6) * i;
          const progress = nx / w;
          const ny = (h * 0.82 - progress * (h * 0.62)) + Math.sin(nx * 0.005 + time) * 35 + Math.cos(nx * 0.008 - time * 0.7) * 20;
          
          // Outer Pulse Ring
          const pulse = (Math.sin(time * 3 + i) + 1) * 3.5;
          ctx.beginPath();
          ctx.arc(nx, ny, 5 + pulse, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.45)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Inner Solid Glowing Node
          ctx.beginPath();
          ctx.arc(nx, ny, 3, 0, Math.PI * 2);
          ctx.fillStyle = '#fbbf24';
          ctx.fill();
        }

        ctx.restore();

        // 2. Draw Floating Upward Wealth & Mutual Fund Growth Badges
        items.forEach(function(item) {
          item.y -= item.vy;
          item.x += item.vx;

          if (item.y < -40) {
            item.y = h + 40;
            const isLeft = Math.random() < 0.52;
            item.x = isLeft ? Math.random() * (w * 0.22) + 10 : w * 0.78 + Math.random() * (w * 0.20);
          }

          ctx.save();
          ctx.translate(item.x, item.y);
          ctx.globalAlpha = item.alpha;

          if (item.isBadge && !['📈', '💹', '⭐'].includes(item.text)) {
            // Draw sleek rounded financial badge pill
            ctx.font = 'bold ' + Math.round(item.size) + 'px sans-serif';
            const metrics = ctx.measureText(item.text);
            const padX = 7;
            const padY = 3.5;
            const boxW = metrics.width + padX * 2;
            const boxH = item.size + padY * 2;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
            ctx.strokeStyle = item.color;
            ctx.lineWidth = 1.2;
            
            // Rounded rectangle badge
            ctx.beginPath();
            if (ctx.roundRect) {
              ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 6);
            } else {
              ctx.rect(-boxW / 2, -boxH / 2, boxW, boxH);
            }
            ctx.fill();
            ctx.stroke();

            // Text
            ctx.fillStyle = item.color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(item.text, 0, 1);
          } else {
            // Standalone glowing symbol / currency
            ctx.font = (item.text === '₹' ? 'bold ' : '') + Math.round(item.size * 1.35) + 'px sans-serif';
            ctx.fillStyle = item.color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(item.text, 0, 0);
          }

          ctx.restore();
        });

        requestAnimationFrame(render);
      }

      render();
    })();
  </script>
  <script>
    (function() {
      // Unified Global Scroll & Reveal Manager
      let ticking = false;
      const progressBar = document.getElementById('scroll-progress-indicator');
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function onScrollUpdate() {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
        
        // 1. Scroll Progress Bar
        if (progressBar && scrollHeight > 0) {
          const progress = Math.min(100, Math.max(0, (scrollTop / scrollHeight) * 100));
          progressBar.style.width = progress + '%';
        }

        // 2. Header Compression
        const headerEl = document.querySelector('header');
        if (headerEl) {
          if (scrollTop > 60) {
            headerEl.classList.add('header-compressed');
          } else {
            headerEl.classList.remove('header-compressed');
          }
        }

        // 3. Ambient Parallax (Disabled on reduced motion)
        if (!prefersReduced) {
          const bgGrid = document.querySelector('.wealth-bg-grid');
          if (bgGrid) {
            bgGrid.style.transform = 'translateY(' + Math.min(60, scrollTop * 0.08) + 'px)';
          }
        }

        ticking = false;
      }

      window.addEventListener('scroll', function() {
        if (!ticking) {
          window.requestAnimationFrame(onScrollUpdate);
          ticking = true;
        }
      }, { passive: true });

      // Staggered Scroll-Reveal Observer for Grid Cards
      const revealObserver = new IntersectionObserver(function(entries, observer) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
            observer.unobserve(entry.target);
          }
        });
      }, { rootMargin: '0px 0px -50px 0px', threshold: 0.1 });

      function initScrollReveals() {
        const elements = document.querySelectorAll('.scroll-reveal:not(.revealed)');
        elements.forEach(function(el, idx) {
          if (!el.style.transitionDelay) {
            el.style.transitionDelay = (idx % 6 * 45) + 'ms';
          }
          revealObserver.observe(el);
        });
      }

      // Check on load and when DOM mutates
      setTimeout(initScrollReveals, 300);
      const domObserver = new MutationObserver(function() {
        initScrollReveals();
      });
      domObserver.observe(document.body, { childList: true, subtree: true });

    })();
  </script>
