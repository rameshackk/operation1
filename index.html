<body class="text-slate-900 dark:text-slate-100 antialiased relative">

  <!-- High-Performance Animated Money & Mutual Fund Growth Canvas -->
  <canvas id="wealth-growth-canvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:0;"></canvas>

  <script>
    (function() {
      const canvas = document.getElementById('wealth-growth-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d', { alpha: true });
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      let mouse = { x: -1000, y: -1000 };
      window.addEventListener('mousemove', function(e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      }, { passive: true });

      window.addEventListener('resize', function() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const tokenList = [
        { text: '₹', type: 'coin' },
        { text: '+18.4%', type: 'badge' },
        { text: 'SIP ↑', type: 'badge' },
        { text: 'CAGR +15%', type: 'badge' },
        { text: '₹1 Crore', type: 'badge' },
        { text: 'MUTUAL FUND', type: 'badge' },
        { text: '+14.2%', type: 'badge' },
        { text: '₹50 Lakh', type: 'badge' },
        { text: '₹', type: 'coin' },
        { text: 'NAV ↑', type: 'badge' },
        { text: 'BULL RUN', type: 'badge' },
        { text: '+21.6%', type: 'badge' },
        { text: '₹25L SIP', type: 'badge' },
        { text: 'candle', type: 'candle' },
        { text: 'candle', type: 'candle' }
      ];

      const count = Math.min(38, Math.max(20, Math.floor(width / 38)));
      const particles = [];

      for (let i = 0; i < count; i++) {
        const item = tokenList[i % tokenList.length];
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.35,
          vy: -(0.35 + Math.random() * 0.55),
          text: item.text,
          type: item.type,
          size: item.type === 'coin' ? (12 + Math.random() * 6) : (10 + Math.random() * 4),
          baseAlpha: 0.28 + Math.random() * 0.35,
          phase: Math.random() * Math.PI * 2,
          isGold: Math.random() > 0.45,
          candleH: 12 + Math.random() * 16,
          candleW: 4 + Math.random() * 3
        });
      }

      let time = 0;
      function animate() {
        time += 0.014;
        ctx.clearRect(0, 0, width, height);

        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const goldPrimary = isDark ? 'rgba(245, 158, 11, 0.45)' : 'rgba(217, 119, 6, 0.4)';
        const goldFill = isDark ? 'rgba(245, 158, 11, 0.06)' : 'rgba(217, 119, 6, 0.05)';
        const emeraldPrimary = isDark ? 'rgba(16, 185, 129, 0.4)' : 'rgba(5, 150, 105, 0.35)';
        const sapphirePrimary = isDark ? 'rgba(56, 189, 248, 0.35)' : 'rgba(2, 132, 199, 0.3)';

        // 1. PRIMARY COMPOUNDING CURVE WITH SHADED AREA (GOLD YIELD)
        ctx.beginPath();
        const startY1 = height * 0.88;
        ctx.moveTo(0, startY1);
        for (let x = 0; x <= width; x += 12) {
          const progress = x / width;
          const expRise = Math.pow(progress, 2.05) * (height * 0.58);
          const wave = Math.sin(progress * 4.2 + time) * 18 + Math.cos(progress * 2.1 - time * 0.8) * 12;
          ctx.lineTo(x, startY1 - expRise + wave);
        }
        ctx.lineWidth = isDark ? 2.5 : 2;
        ctx.strokeStyle = goldPrimary;
        ctx.stroke();

        // Area under gold curve
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fillStyle = goldFill;
        ctx.fill();

        // 2. SECONDARY MUTUAL FUND GROWTH CURVE (EMERALD YIELD)
        ctx.beginPath();
        const startY2 = height * 0.94;
        ctx.moveTo(0, startY2);
        for (let x = 0; x <= width; x += 12) {
          const progress = x / width;
          const expRise = Math.pow(progress, 1.85) * (height * 0.52);
          const wave = Math.cos(progress * 3.6 + time * 0.9) * 16 + Math.sin(progress * 2.4 + time) * 10;
          ctx.lineTo(x, startY2 - expRise + wave);
        }
        ctx.lineWidth = isDark ? 2 : 1.8;
        ctx.strokeStyle = emeraldPrimary;
        ctx.stroke();

        // 3. TERTIARY ALPHA INDEX CURVE (SAPPHIRE)
        ctx.beginPath();
        const startY3 = height * 0.82;
        ctx.moveTo(0, startY3);
        for (let x = 0; x <= width; x += 15) {
          const progress = x / width;
          const expRise = Math.pow(progress, 2.3) * (height * 0.65);
          const wave = Math.sin(progress * 3.1 - time * 0.7) * 14;
          ctx.lineTo(x, startY3 - expRise + wave);
        }
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = sapphirePrimary;
        ctx.stroke();

        // 4. PULSE NODES & LIVE BADGES ON CURVES
        const pulse1 = (time * 0.1) % 1;
        const pX1 = pulse1 * width;
        const pY1 = startY1 - (Math.pow(pulse1, 2.05) * (height * 0.58)) + (Math.sin(pulse1 * 4.2 + time) * 18 + Math.cos(pulse1 * 2.1 - time * 0.8) * 12);
        
        ctx.save();
        ctx.fillStyle = isDark ? 'rgba(251, 191, 36, 0.95)' : 'rgba(217, 119, 6, 0.9)';
        ctx.shadowColor = isDark ? 'rgba(245, 158, 11, 0.8)' : 'rgba(217, 119, 6, 0.5)';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(pX1, pY1, 5, 0, Math.PI * 2);
        ctx.fill();

        // Floating Yield Badge
        ctx.font = '800 10px "Inter", sans-serif';
        const badgeTxt = 'SIP CAGR +16.8% ↑';
        const txtWidth = ctx.measureText(badgeTxt).width;
        ctx.fillStyle = isDark ? 'rgba(15, 23, 42, 0.88)' : 'rgba(255, 255, 255, 0.92)';
        ctx.beginPath();
        ctx.roundRect(pX1 - txtWidth / 2 - 6, pY1 - 22, txtWidth + 12, 16, 6);
        ctx.fill();
        ctx.strokeStyle = isDark ? 'rgba(245, 158, 11, 0.6)' : 'rgba(217, 119, 6, 0.5)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = isDark ? '#fbbf24' : '#b45309';
        ctx.fillText(badgeTxt, pX1 - txtWidth / 2, pY1 - 10);
        ctx.restore();

        // 5. CONSTELLATION CONNECTION THREADS
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 105) {
              const lineAlpha = (1 - dist / 105) * 0.18;
              ctx.strokeStyle = isDark ? ('rgba(245, 158, 11, ' + lineAlpha + ')') : ('rgba(5, 150, 105, ' + lineAlpha + ')');
              ctx.lineWidth = 0.75;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }

        // 6. FLOATING MONEY & MUTUAL FUND GROWTH PARTICLES
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          // Movement
          p.y += p.vy;
          p.x += Math.sin(time * 1.2 + p.phase) * 0.45 + p.vx;

          // Mouse deflection
          const mdx = p.x - mouse.x;
          const mdy = p.y - mouse.y;
          const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
          if (mDist < 120) {
            const force = (1 - mDist / 120) * 1.5;
            p.x += (mdx / mDist) * force;
            p.y += (mdy / mDist) * force;
          }

          // Screen Wrap
          if (p.y < -40) {
            p.y = height + 30;
            p.x = Math.random() * width;
          }
          if (p.x < -60) p.x = width + 40;
          if (p.x > width + 60) p.x = -40;

          const alpha = p.baseAlpha * (0.8 + Math.sin(time * 2.5 + p.phase) * 0.2);

          if (p.type === 'coin') {
            // Glowing Rupee Coin
            ctx.save();
            ctx.fillStyle = isDark ? ('rgba(245, 158, 11, ' + (alpha * 0.25) + ')') : ('rgba(217, 119, 6, ' + (alpha * 0.2) + ')');
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 0.9, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = isDark ? ('rgba(251, 191, 36, ' + alpha + ')') : ('rgba(180, 83, 9, ' + alpha + ')');
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.font = '900 ' + (p.size * 0.9) + 'px "Inter", sans-serif';
            ctx.fillStyle = isDark ? ('rgba(251, 191, 36, ' + alpha + ')') : ('rgba(180, 83, 9, ' + alpha + ')');
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('₹', p.x, p.y);
            ctx.restore();

          } else if (p.type === 'candle') {
            // Green Financial Growth Candlestick
            ctx.save();
            const candleAlpha = alpha * 0.85;
            const cColor = isDark ? ('rgba(16, 185, 129, ' + candleAlpha + ')') : ('rgba(5, 150, 105, ' + candleAlpha + ')');
            ctx.strokeStyle = cColor;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y - p.candleH * 0.7);
            ctx.lineTo(p.x, p.y + p.candleH * 0.7);
            ctx.stroke();
            ctx.fillStyle = cColor;
            ctx.fillRect(p.x - p.candleW / 2, p.y - p.candleH * 0.35, p.candleW, p.candleH * 0.7);
            ctx.restore();

          } else {
            // Financial Text Pill Badge
            ctx.save();
            ctx.font = '800 ' + p.size + 'px "Inter", sans-serif';
            const tWidth = ctx.measureText(p.text).width;
            
            // Badge background
            ctx.fillStyle = isDark
              ? ('rgba(15, 23, 42, ' + (alpha * 0.7) + ')')
              : ('rgba(255, 255, 255, ' + (alpha * 0.8) + ')');
            ctx.beginPath();
            ctx.roundRect(p.x - tWidth / 2 - 4, p.y - p.size / 2 - 3, tWidth + 8, p.size + 6, 4);
            ctx.fill();

            // Badge border
            ctx.strokeStyle = p.isGold
              ? (isDark ? ('rgba(245, 158, 11, ' + (alpha * 0.7) + ')') : ('rgba(217, 119, 6, ' + (alpha * 0.6) + ')'))
              : (isDark ? ('rgba(16, 185, 129, ' + (alpha * 0.7) + ')') : ('rgba(5, 150, 105, ' + (alpha * 0.6) + ')'));
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // Text
            ctx.fillStyle = p.isGold
              ? (isDark ? ('rgba(251, 191, 36, ' + alpha + ')') : ('rgba(180, 83, 9, ' + alpha + ')'))
              : (isDark ? ('rgba(52, 211, 153, ' + alpha + ')') : ('rgba(4, 120, 87, ' + alpha + ')'));
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.text, p.x, p.y);
            ctx.restore();
          }
        }

        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      // Unified Global Scroll & Reveal Manager
      let ticking = false;
      const progressBar = document.getElementById('scroll-progress-indicator');
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function onScrollUpdate() {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
        
        // 1. Scroll Progress Bar
        if (progressBar && scrollHeight > 0) {
          const progress = Math.min(100, Math.max(0, (scrollTop / scrollHeight) * 100));
          progressBar.style.width = progress + '%';
        }

        // 2. Header Compression
        const headerEl = document.querySelector('header');
        if (headerEl) {
          if (scrollTop > 60) {
            headerEl.classList.add('header-compressed');
          } else {
            headerEl.classList.remove('header-compressed');
          }
        }

        // 3. Ambient Parallax (Disabled on reduced motion)
        if (!prefersReduced) {
          const bgGrid = document.querySelector('.wealth-bg-grid');
          if (bgGrid) {
            bgGrid.style.transform = 'translateY(' + Math.min(60, scrollTop * 0.08) + 'px)';
          }
        }

        ticking = false;
      }

      window.addEventListener('scroll', function() {
        if (!ticking) {
          window.requestAnimationFrame(onScrollUpdate);
          ticking = true;
        }
      }, { passive: true });

      // Staggered Scroll-Reveal Observer for Grid Cards
      const revealObserver = new IntersectionObserver(function(entries, observer) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
            observer.unobserve(entry.target);
          }
        });
      }, { rootMargin: '0px 0px -50px 0px', threshold: 0.1 });

      function initScrollReveals() {
        const elements = document.querySelectorAll('.scroll-reveal:not(.revealed)');
        elements.forEach(function(el, idx) {
          if (!el.style.transitionDelay) {
            el.style.transitionDelay = (idx % 6 * 45) + 'ms';
          }
          revealObserver.observe(el);
        });
      }

      // Check on load and when DOM mutates
      setTimeout(initScrollReveals, 300);
      const domObserver = new MutationObserver(function() {
        initScrollReveals();
      });
      domObserver.observe(document.body, { childList: true, subtree: true });

    })();
  </script>

  <div id="scroll-progress-indicator"></div>
